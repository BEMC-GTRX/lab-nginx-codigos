# Sitio del laboratorio lab-nginx-codigos (instalado por preparar-lab.sh).
# Usa el puerto 8080 para no chocar con otros sitios del puerto 80 y solo
# escucha en 127.0.0.1: el laboratorio no es accesible desde la red. No escucha
# en [::1] para que nginx no deje de arrancar en equipos con IPv6 desactivado.
server {
	listen 127.0.0.1:8080;
	server_name localhost;

	root /var/www/html;
	index index.html;

	# No revelar la versión exacta de nginx en cabeceras y páginas de error.
	server_tokens off;

	# Archivos ocultos (como el marcador .lab-nginx-codigos): nunca se sirven.
	location ~ /\. {
		return 404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
