# Sitio del laboratorio lab-nginx-5xx (instalado por instalar.sh).
# nginx hace de proxy: recibe las peticiones en el puerto 8081 y se las pasa a la
# aplicación de 127.0.0.1:8001. Solo escucha en 127.0.0.1: no es accesible desde la red.
server {
	listen 127.0.0.1:8081;
	server_name localhost;

	# No revelar la versión exacta de nginx en cabeceras y páginas de error.
	server_tokens off;

	# Registros propios del laboratorio: aquí aparece la causa de los 502.
	access_log /var/log/nginx/lab-nginx-5xx.access.log;
	error_log /var/log/nginx/lab-nginx-5xx.error.log;

	location / {
		proxy_pass http://127.0.0.1:8001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
